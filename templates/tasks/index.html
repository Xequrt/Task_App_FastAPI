<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Задачи</title>
  </head>
  <body>
    <h1>Задачи</h1>
    {% if tasks %}
      <p>Найдено задач: {{ tasks | length }}</p>
      <ul>
        {% for task in tasks %}
          <li>
            <a href="/tasks/{{ task.id }}">{{ task.title }}</a>
            {% if task.completed %}
              <span>Выполнена</span>
            {% else %}
              <span>Активна</span>
            {% endif %}
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>Задач пока нет</p>
    {% endif %}
  </body>
</html>
